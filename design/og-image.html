<!doctype html>
<!-- Source for public/og-image.png (link preview, 1200x630).
     Regenerate: chrome --headless=new --screenshot=public/og-image.png --window-size=1200,630 design/og-image.html -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e8ebf3;
    background: linear-gradient(135deg, #12151d 0%, #1b2236 100%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px; gap: 36px; position: relative;
  }
  .bar { position: absolute; left: 0; top: 0; width: 100%; height: 14px;
         background: linear-gradient(90deg, #a31f2c 0 50%, #1d4fb0 50% 100%); }
  .brand { display: flex; align-items: center; gap: 28px; }
  .key {
    width: 120px; height: 120px; border-radius: 28px; background: #2b6cd9;
    box-shadow: 0 10px 0 #1d4ea6; display: grid; place-items: center;
    font-size: 84px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 112px; line-height: 1; letter-spacing: 0.01em; }
  .tag { font-size: 38px; color: #aab3c5; }
  .rows { display: flex; flex-direction: column; gap: 18px; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 22px; font-size: 44px; }
  .flag { width: 66px; height: 45px; border-radius: 5px; box-shadow: 0 0 0 2px rgb(255 255 255 / 0.25); flex: none; overflow: hidden; }
  .be { background: linear-gradient(#fff 0 33.3%, #cf101a 33.3% 66.6%, #fff 66.6%); }
  .uk { background: linear-gradient(#0057b8 0 50%, #ffd700 50%); }
  .latin { color: #aab3c5; min-width: 360px; }
  .arrow { color: #6fa0f5; }
  .cyr { font-weight: 700; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="brand">
    <div class="key">K</div>
    <div>
      <h1>Klaveo</h1>
      <div class="tag">Type in Latin – get Cyrillic as you type</div>
    </div>
  </div>
  <div class="rows">
    <div class="row"><div class="flag uk"></div><span class="latin">Slava Ukrajini</span><span class="arrow">→</span><span class="cyr">Слава Україні</span></div>
    <div class="row"><div class="flag be"></div><span class="latin">Zhyve Belarus'</span><span class="arrow">→</span><span class="cyr">Жыве Беларусь</span></div>
  </div>
</body>
</html>
