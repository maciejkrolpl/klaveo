<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klaveo – Latin to Cyrillic</title>
    <meta
      name="description"
      content="Type in Latin letters and get Belarusian or Ukrainian Cyrillic instantly as you type. Free, runs in your browser, nothing is sent anywhere."
    />

    <!-- Link preview (chat apps, social networks) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klaveo" />
    <meta property="og:title" content="Klaveo – Latin to Cyrillic as you type" />
    <meta
      property="og:description"
      content="Type Slava Ukrajini, get Слава Україні. Belarusian and Ukrainian live transliteration, free and private."
    />
    <meta property="og:url" content="https://getklaveo.web.app/" />
    <meta property="og:image" content="https://getklaveo.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Klaveo: Slava Ukrajini becomes Слава Україні, Zhyve Belarus' becomes Жыве Беларусь" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash of the wrong colours.
      try {
        var t = localStorage.getItem('klaveo.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
